<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ФутболБилеты Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        :root {
            --primary: #6c5ce7;
            --primary-light: #a29bfe;
            --accent: #00b894;
            --accent-glow: rgba(0, 184, 148, 0.4);
            --danger: #e74c3c;
            --bg-dark: #0a0a0f;
            --bg-card: #1a1a2e;
            --bg-card-hover: #16213e;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --gradient-1: linear-gradient(135deg, #6c5ce7, #a29bfe);
            --gradient-2: linear-gradient(135deg, #00b894, #00cec9);
            --gradient-3: linear-gradient(135deg, #fd79a8, #e84393);
        }

        /* Header */
        .header {
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(20px);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(108, 92, 231, 0.2);
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .back-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(108, 92, 231, 0.2);
            border: none;
            color: var(--primary-light);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .back-btn:active {
            transform: scale(0.9);
        }

        /* Screens */
        .screen {
            display: none;
            padding: 16px;
            padding-bottom: 100px;
            animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { 
                opacity: 0; 
                transform: translateY(20px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }

        @keyframes slideInRight {
            from { 
                opacity: 0; 
                transform: translateX(50px); 
            }
            to { 
                opacity: 1; 
                transform: translateX(0); 
            }
        }

        @keyframes scaleIn {
            from { 
                opacity: 0; 
                transform: scale(0.8); 
            }
            to { 
                opacity: 1; 
                transform: scale(1); 
            }
        }

        /* Stadium Selection */
        .stadium-selector {
            margin-bottom: 20px;
        }

        .stadium-cards {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 8px 0;
            scrollbar-width: none;
        }

        .stadium-cards::-webkit-scrollbar {
            display: none;
        }

        .stadium-card {
            min-width: 200px;
            background: var(--bg-card);
            border-radius: 16px;
            padding: 16px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .stadium-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--gradient-1);
            transform: scaleX(0);
            transition: transform 0.3s;
        }

        .stadium-card.active {
            border-color: var(--primary);
            background: var(--bg-card-hover);
        }

        .stadium-card.active::before {
            transform: scaleX(1);
        }

        .stadium-card-name {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .stadium-card-city {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .stadium-card-capacity {
            font-size: 10px;
            color: var(--primary-light);
            margin-top: 8px;
        }

        /* Stadium Map Container */
        .stadium-map-wrapper {
            position: relative;
            background: var(--bg-card);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            overflow: hidden;
        }

        .stadium-map-container {
            width: 100%;
            height: 500px;
            position: relative;
            overflow: hidden;
            cursor: grab;
            border-radius: 12px;
            background: radial-gradient(ellipse at center, #1a2332 0%, #0a0a0f 100%);
        }

        .stadium-map-container:active {
            cursor: grabbing;
        }

        .stadium-svg {
            width: 100%;
            height: 100%;
            transition: transform 0.3s;
        }

        /* Map Controls */
        .map-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 10;
        }

        .map-control-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(108, 92, 231, 0.3);
            color: var(--primary-light);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .map-control-btn:active {
            transform: scale(0.9);
            background: rgba(108, 92, 231, 0.3);
        }

        /* Section Info Panel */
        .section-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(108, 92, 231, 0.3);
            display: none;
            animation: slideInRight 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .section-info.visible {
            display: block;
        }

        .section-info-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .section-info-title {
            font-size: 18px;
            font-weight: 700;
        }

        .section-info-price {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent);
        }

        .section-info-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .section-stat {
            background: rgba(255,255,255,0.05);
            padding: 8px;
            border-radius: 8px;
            text-align: center;
        }

        .section-stat-label {
            font-size: 9px;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .section-stat-value {
            font-size: 14px;
            font-weight: 700;
        }

        .section-actions {
            display: flex;
            gap: 8px;
        }

        .section-btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .section-btn-primary {
            background: var(--gradient-1);
            color: white;
        }

        .section-btn-secondary {
            background: rgba(108, 92, 231, 0.1);
            color: var(--primary-light);
            border: 1px solid rgba(108, 92, 231, 0.3);
        }

        .section-btn:active {
            transform: scale(0.95);
        }

        /* Seat Selection Grid */
        .seat-selection-container {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            animation: scaleIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .seat-grid-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .seat-grid-title {
            font-size: 16px;
            font-weight: 700;
        }

        .seat-legend {
            display: flex;
            gap: 12px;
            font-size: 11px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        .legend-dot.available {
            background: rgba(108, 92, 231, 0.6);
            border: 1px solid var(--primary-light);
        }

        .legend-dot.selected {
            background: var(--accent);
            border: 2px solid #00b894;
        }

        .legend-dot.sold {
            background: rgba(100, 100, 100, 0.3);
        }

        .seat-screen {
            background: #0a0a0f;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
        }

        .seat-screen::before {
            content: 'ПОЛЕ';
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            color: var(--text-secondary);
            letter-spacing: 2px;
        }

        .seat-rows {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .seat-row {
            display: flex;
            gap: 6px;
            justify-content: center;
            align-items: center;
        }

        .seat-row-label {
            width: 24px;
            font-size: 10px;
            color: var(--text-secondary);
            text-align: center;
        }

        .seat {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .seat.available {
            background: rgba(108, 92, 231, 0.3);
            border: 1px solid rgba(108, 92, 231, 0.6);
            color: var(--primary-light);
        }

        .seat.available:hover {
            background: rgba(108, 92, 231, 0.5);
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(108, 92, 231, 0.4);
        }

        .seat.selected {
            background: var(--accent);
            border: 2px solid #00b894;
            color: #000;
            box-shadow: 0 0 20px var(--accent-glow);
            animation: pulse 1.5s infinite;
        }

        .seat.sold {
            background: rgba(100, 100, 100, 0.15);
            cursor: not-allowed;
            opacity: 0.4;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 20px var(--accent-glow);
            }
            50% {
                box-shadow: 0 0 30px var(--accent-glow), 0 0 40px rgba(0, 184, 148, 0.2);
            }
        }

        /* 3D Preview */
        .preview-3d-container {
            background: var(--bg-card);
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 16px;
            animation: scaleIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .preview-3d-viewport {
            width: 100%;
            height: 300px;
            background: linear-gradient(180deg, #0a0a0f 0%, #1a2332 30%, #2d4a3e 50%, #1a5c32 70%, #0d2818 100%);
            position: relative;
            overflow: hidden;
            perspective: 1000px;
        }

        .preview-field {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%) rotateX(60deg) translateZ(-100px);
            width: 120%;
            height: 200%;
            background: repeating-linear-gradient(
                90deg,
                #2d8a4e 0px,
                #2d8a4e 40px,
                #1a5c32 40px,
                #1a5c32 80px
            );
            border: 3px solid rgba(255,255,255,0.3);
            transform-origin: bottom center;
        }

        .preview-field-lines {
            position: absolute;
            bottom: 20%;
            left: 15%;
            right: 15%;
            height: 40%;
            border: 2px solid rgba(255,255,255,0.4);
            transform: perspective(500px) rotateX(45deg);
        }

        .preview-field-center {
            position: absolute;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%) perspective(500px) rotateX(45deg);
            width: 60px;
            height: 60px;
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 50%;
        }

        .preview-crowd {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 35%;
            background: linear-gradient(180deg, 
                rgba(108, 92, 231, 0.2) 0%, 
                rgba(108, 92, 231, 0.1) 50%, 
                transparent 100%
            );
            animation: crowdWave 3s ease-in-out infinite;
        }

        @keyframes crowdWave {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 0.9; }
        }

        .preview-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at center bottom, transparent 30%, rgba(0,0,0,0.4) 100%);
        }

        .preview-stats {
            position: absolute;
            bottom: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .preview-stat-card {
            flex: 1;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(108, 92, 231, 0.3);
        }

        .preview-stat-label {
            font-size: 9px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .preview-stat-value {
            font-size: 14px;
            font-weight: 700;
            color: white;
        }

        .preview-controls {
            padding: 16px;
            display: flex;
            gap: 8px;
        }

        .preview-control-btn {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(108, 92, 231, 0.3);
            background: rgba(108, 92, 231, 0.1);
            color: var(--primary-light);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .preview-control-btn:active {
            background: rgba(108, 92, 231, 0.3);
            transform: scale(0.95);
        }

        /* Seat Info Card */
        .seat-info-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(108, 92, 231, 0.2);
        }

        .seat-info-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .seat-info-title {
            font-size: 16px;
            font-weight: 700;
        }

        .seat-quality-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .quality-excellent {
            background: rgba(0, 184, 148, 0.2);
            color: var(--accent);
        }

        .quality-good {
            background: rgba(108, 92, 231, 0.2);
            color: var(--primary-light);
        }

        .quality-average {
            background: rgba(253, 121, 168, 0.2);
            color: #fd79a8;
        }

        .seat-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .seat-detail {
            background: rgba(255,255,255,0.03);
            padding: 12px;
            border-radius: 10px;
        }

        .seat-detail-label {
            font-size: 10px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .seat-detail-value {
            font-size: 14px;
            font-weight: 600;
        }

        /* Bottom Bar */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(20px);
            padding: 16px 20px;
            padding-bottom: calc(16px + env(safe-area-inset-bottom));
            border-top: 1px solid rgba(108, 92, 231, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
            animation: slideInUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideInUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }

        .bottom-bar-info {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .bottom-bar-info span {
            display: block;
            font-size: 20px;
            font-weight: 700;
            color: var(--accent);
        }

        .btn-primary {
            padding: 14px 32px;
            border-radius: 12px;
            border: none;
            background: var(--gradient-1);
            color: white;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3);
        }

        .btn-primary:active {
            transform: scale(0.95);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: var(--bg-card);
            border: 1px solid var(--primary);
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 13px;
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Loading */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 10, 15, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .loading-overlay.show {
            display: flex;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(108, 92, 231, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="toast" id="toast"></div>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loader"></div>
    </div>

    <div class="header" id="header">
        <button class="back-btn" id="backBtn" style="display:none;" onclick="goBack()">←</button>
        <div class="header-title" id="headerTitle">⚽ ФутболБилеты Pro</div>
        <div style="width: 36px;"></div>
    </div>

    <!-- Screen: Stadium Selection -->
    <div class="screen active" id="screen-stadium-select">
        <h2 style="font-size: 18px; font-weight: 700; margin-bottom: 16px;">Выберите стадион</h2>
        <div class="stadium-selector">
            <div class="stadium-cards" id="stadiumCards"></div>
        </div>
    </div>

    <!-- Screen: Stadium Map -->
    <div class="screen" id="screen-stadium-map">
        <div class="stadium-map-wrapper">
            <div class="stadium-map-container" id="mapContainer">
                <svg class="stadium-svg" id="stadiumSvg" viewBox="0 0 800 600"></svg>
            </div>
            <div class="map-controls">
                <button class="map-control-btn" onclick="zoomIn()">+</button>
                <button class="map-control-btn" onclick="zoomOut()">−</button>
                <button class="map-control-btn" onclick="resetZoom()">⟲</button>
            </div>
            <div class="section-info" id="sectionInfo">
                <div class="section-info-header">
                    <div class="section-info-title" id="sectionInfoTitle">Сектор A</div>
                    <div class="section-info-price" id="sectionInfoPrice">5 000 ₽</div>
                </div>
                <div class="section-info-stats">
                    <div class="section-stat">
                        <div class="section-stat-label">Рядов</div>
                        <div class="section-stat-value" id="sectionRows">12</div>
                    </div>
                    <div class="section-stat">
                        <div class="section-stat-label">Мест</div>
                        <div class="section-stat-value" id="sectionSeats">240</div>
                    </div>
                    <div class="section-stat">
                        <div class="section-stat-label">Доступно</div>
                        <div class="section-stat-value" id="sectionAvailable">180</div>
                    </div>
                </div>
                <div class="section-actions">
                    <button class="section-btn section-btn-secondary" onclick="closeSectionInfo()">Закрыть</button>
                    <button class="section-btn section-btn-primary" onclick="selectSection()">Выбрать места</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Screen: Seat Selection -->
    <div class="screen" id="screen-seat-select">
        <div class="seat-selection-container">
            <div class="seat-grid-header">
                <div class="seat-grid-title" id="seatGridTitle">Сектор A — Выберите место</div>
                <div class="seat-legend">
                    <div class="legend-item"><div class="legend-dot available"></div>Свободно</div>
                    <div class="legend-item"><div class="legend-dot selected"></div>Выбрано</div>
                    <div class="legend-item"><div class="legend-dot sold"></div>Занято</div>
                </div>
            </div>
            <div class="seat-screen">
                <div class="seat-rows" id="seatRows"></div>
            </div>
        </div>
    </div>

    <!-- Screen: 3D Preview -->
    <div class="screen" id="screen-preview">
        <div class="preview-3d-container">
            <div class="preview-3d-viewport" id="previewViewport">
                <div class="preview-crowd"></div>
                <div class="preview-field"></div>
                <div class="preview-field-lines"></div>
                <div class="preview-field-center"></div>
                <div class="preview-overlay"></div>
                <div class="preview-stats">
                    <div class="preview-stat-card">
                        <div class="preview-stat-label">Расстояние</div>
                        <div class="preview-stat-value" id="previewDistance">15м</div>
                    </div>
                    <div class="preview-stat-card">
                        <div class="preview-stat-label">Угол обзора</div>
                        <div class="preview-stat-value" id="previewAngle">45°</div>
                    </div>
                    <div class="preview-stat-card">
                        <div class="preview-stat-label">Качество</div>
                        <div class="preview-stat-value" id="previewQuality">Отличное</div>
                    </div>
                </div>
            </div>
            <div class="preview-controls">
                <button class="preview-control-btn" onclick="rotateView()">
                    🔄 Панорама
                </button>
                <button class="preview-control-btn" onclick="toggle360()">
                    🎥 360°
                </button>
                <button class="preview-control-btn" onclick="shareView()">
                    📤 Поделиться
                </button>
            </div>
        </div>

        <div class="seat-info-card">
            <div class="seat-info-header">
                <div class="seat-info-title" id="seatInfoTitle">Сектор A, Ряд 5, Место 12</div>
                <div class="seat-quality-badge quality-excellent" id="seatQualityBadge">Отличный вид</div>
            </div>
            <div class="seat-details">
                <div class="seat-detail">
                    <div class="seat-detail-label">Сектор</div>
                    <div class="seat-detail-value" id="seatInfoSector">A</div>
                </div>
                <div class="seat-detail">
                    <div class="seat-detail-label">Ряд</div>
                    <div class="seat-detail-value" id="seatInfoRow">5</div>
                </div>
                <div class="seat-detail">
                    <div class="seat-detail-label">Место</div>
                    <div class="seat-detail-value" id="seatInfoSeat">12</div>
                </div>
                <div class="seat-detail">
                    <div class="seat-detail-label">Категория</div>
                    <div class="seat-detail-value" id="seatInfoCategory">VIP</div>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-bar" id="bottomBar" style="display:none;">
        <div class="bottom-bar-info">
            <span id="bottomPrice">от 2 500 ₽</span>
            <span id="bottomLabel">Выберите сектор</span>
        </div>
        <button class="btn-primary" id="bottomBtn" onclick="nextScreen()" disabled>
            Продолжить
        </button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Stadium configurations
        const stadiums = {
            luzhniki: {
                id: 'luzhniki',
                name: 'Лужники',
                city: 'Москва',
                capacity: 81000,
                sections: [
                    { id: 'A', name: 'Центральная трибуна A', rows: 20, seatsPerRow: 30, price: 8000, color: '#6c5ce7', angle: 0, distance: 15 },
                    { id: 'B', name: 'Трибуна B', rows: 18, seatsPerRow: 28, price: 6000, color: '#74b9ff', angle: 45, distance: 25 },
                    { id: 'C', name: 'Трибуна C (за воротами)', rows: 15, seatsPerRow: 25, price: 4000, color: '#fd79a8', angle: 90, distance: 35 },
                    { id: 'D', name: 'Трибуна D', rows: 18, seatsPerRow: 28, price: 6000, color: '#74b9ff', angle: 135, distance: 25 },
                    { id: 'E', name: 'Центральная трибуна E', rows: 20, seatsPerRow: 30, price: 8000, color: '#6c5ce7', angle: 180, distance: 15 },
                    { id: 'F', name: 'Трибуна F', rows: 18, seatsPerRow: 28, price: 6000, color: '#74b9ff', angle: 225, distance: 25 },
                    { id: 'G', name: 'Трибуна G (за воротами)', rows: 15, seatsPerRow: 25, price: 4000, color: '#fd79a8', angle: 270, distance: 35 },
                    { id: 'H', name: 'Трибуна H', rows: 18, seatsPerRow: 28, price: 6000, color: '#74b9ff', angle: 315, distance: 25 }
                ]
            },
            otkritie: {
                id: 'otkritie',
                name: 'Открытие Арена',
                city: 'Москва',
                capacity: 45000,
                sections: [
                    { id: 'VIP1', name: 'VIP Ложа', rows: 5, seatsPerRow: 10, price: 15000, color: '#ffeaa7', angle: 0, distance: 10 },
                    { id: 'A', name: 'Западная трибуна A', rows: 25, seatsPerRow: 35, price: 5000, color: '#6c5ce7', angle: 0, distance: 20 },
                    { id: 'B', name: 'Северная трибуна B', rows: 20, seatsPerRow: 30, price: 4000, color: '#74b9ff', angle: 90, distance: 30 },
                    { id: 'C', name: 'Восточная трибуна C', rows: 25, seatsPerRow: 35, price: 5000, color: '#6c5ce7', angle: 180, distance: 20 },
                    { id: 'D', name: 'Южная трибуна D', rows: 20, seatsPerRow: 30, price: 4000, color: '#74b9ff', angle: 270, distance: 30 }
                ]
            },
            gazprom: {
                id: 'gazprom',
                name: 'Газпром Арена',
                city: 'Санкт-Петербург',
                capacity: 68000,
                sections: [
                    { id: 'A', name: 'Главная трибуна A', rows: 22, seatsPerRow: 32, price: 7000, color: '#6c5ce7', angle: 0, distance: 18 },
                    { id: 'B', name: 'Трибуна B', rows: 20, seatsPerRow: 30, price: 5500, color: '#74b9ff', angle: 60, distance: 28 },
                    { id: 'C', name: 'Трибуна C', rows: 18, seatsPerRow: 28, price: 4500, color: '#fd79a8', angle: 120, distance: 32 },
                    { id: 'D', name: 'Трибуна D', rows: 20, seatsPerRow: 30, price: 5500, color: '#74b9ff', angle: 180, distance: 28 },
                    { id: 'E', name: 'Трибуна E', rows: 22, seatsPerRow: 32, price: 7000, color: '#6c5ce7', angle: 240, distance: 18 },
                    { id: 'F', name: 'Трибуна F', rows: 18, seatsPerRow: 28, price: 4500, color: '#fd79a8', angle: 300, distance: 32 }
                ]
            }
        };

        let currentScreen = 'stadium-select';
        let selectedStadium = null;
        let selectedSection = null;
        let selectedSeat = null;
        let mapScale = 1;
        let mapTranslateX = 0;
        let mapTranslateY = 0;

        // Initialize stadium cards
        function renderStadiumCards() {
            const container = document.getElementById('stadiumCards');
            container.innerHTML = Object.values(stadiums).map(stadium => `
                <div class="stadium-card ${selectedStadium?.id === stadium.id ? 'active' : ''}" 
                     onclick="selectStadium('${stadium.id}')">
                    <div class="stadium-card-name">${stadium.name}</div>
                    <div class="stadium-card-city">📍 ${stadium.city}</div>
                    <div class="stadium-card-capacity">👥 ${stadium.capacity.toLocaleString()} мест</div>
                </div>
            `).join('');
        }

        function selectStadium(stadiumId) {
            selectedStadium = stadiums[stadiumId];
            renderStadiumCards();
            showScreen('stadium-map');
            renderStadiumMap();
            updateBottomBar();
        }

        function renderStadiumMap() {
            if (!selectedStadium) return;

            const svg = document.getElementById('stadiumSvg');
            const centerX = 400;
            const centerY = 300;
            const radiusX = 250;
            const radiusY = 180;

            let svgContent = `
                <defs>
                    <radialGradient id="fieldGradient">
                        <stop offset="0%" style="stop-color:#2d8a4e;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#1a5c32;stop-opacity:1" />
                    </radialGradient>
                </defs>
                
                <!-- Field -->
                <ellipse cx="${centerX}" cy="${centerY}" rx="150" ry="100" fill="url(#fieldGradient)" stroke="#fff" stroke-width="2"/>
                <line x1="${centerX - 150}" y1="${centerY}" x2="${centerX + 150}" y2="${centerY}" stroke="#fff" stroke-width="2"/>
                <circle cx="${centerX}" cy="${centerY}" r="30" fill="none" stroke="#fff" stroke-width="2"/>
                
                <!-- Stadium outline -->
                <ellipse cx="${centerX}" cy="${centerY}" rx="${radiusX}" ry="${radiusY}" fill="none" stroke="rgba(108, 92, 231, 0.3)" stroke-width="3"/>
            `;

            // Render sections
            selectedStadium.sections.forEach((section, index) => {
                const angle = (section.angle * Math.PI) / 180;
                const sectionRadiusX = radiusX - 40;
                const sectionRadiusY = radiusY - 40;
                
                const x = centerX + Math.cos(angle) * sectionRadiusX;
                const y = centerY + Math.sin(angle) * sectionRadiusY;

                const sectionAngleSpan = (2 * Math.PI) / selectedStadium.sections.length;
                const startAngle = angle - sectionAngleSpan / 2;
                const endAngle = angle + sectionAngleSpan / 2;

                const x1 = centerX + Math.cos(startAngle) * radiusX;
                const y1 = centerY + Math.sin(startAngle) * radiusY;
                const x2 = centerX + Math.cos(endAngle) * radiusX;
                const y2 = centerY + Math.sin(endAngle) * radiusY;

                const ix1 = centerX + Math.cos(startAngle) * (radiusX - 60);
                const iy1 = centerY + Math.sin(startAngle) * (radiusY - 60);
                const ix2 = centerX + Math.cos(endAngle) * (radiusX - 60);
                const iy2 = centerY + Math.sin(endAngle) * (radiusY - 60);

                const path = `M ${x1} ${y1} A ${radiusX} ${radiusY} 0 0 1 ${x2} ${y2} L ${ix2} ${iy2} A ${radiusX - 60} ${radiusY - 60} 0 0 0 ${ix1} ${iy1} Z`;

                svgContent += `
                    <path d="${path}" 
                          fill="${section.color}" 
                          fill-opacity="0.3" 
                          stroke="${section.color}" 
                          stroke-width="2"
                          class="stadium-section"
                          data-section-id="${section.id}"
                          style="cursor: pointer; transition: all 0.3s;"
                          onmouseover="this.style.fillOpacity='0.6'"
                          onmouseout="this.style.fillOpacity='0.3'"
                          onclick="showSectionInfo('${section.id}')"/>
                    
                    <text x="${x}" y="${y}" 
                          text-anchor="middle" 
                          dominant-baseline="middle" 
                          fill="white" 
                          font-size="20" 
                          font-weight="bold"
                          style="pointer-events: none;">
                        ${section.id}
                    </text>
                `;
            });

            svg.innerHTML = svgContent;
        }

        function showSectionInfo(sectionId) {
            const section = selectedStadium.sections.find(s => s.id === sectionId);
            if (!section) return;

            selectedSection = section;
            
            document.getElementById('sectionInfoTitle').textContent = section.name;
            document.getElementById('sectionInfoPrice').textContent = section.price.toLocaleString() + ' ₽';
            document.getElementById('sectionRows').textContent = section.rows;
            document.getElementById('sectionSeats').textContent = section.rows * section.seatsPerRow;
            document.getElementById('sectionAvailable').textContent = Math.floor(section.rows * section.seatsPerRow * 0.75);
            
            document.getElementById('sectionInfo').classList.add('visible');
            updateBottomBar();
        }

        function closeSectionInfo() {
            document.getElementById('sectionInfo').classList.remove('visible');
            selectedSection = null;
            updateBottomBar();
        }

        function selectSection() {
            if (!selectedSection) return;
            closeSectionInfo();
            showScreen('seat-select');
            renderSeatGrid();
            updateBottomBar();
        }

        function renderSeatGrid() {
            if (!selectedSection) return;

            document.getElementById('seatGridTitle').textContent = `${selectedSection.name} — Выберите место`;
            
            const container = document.getElementById('seatRows');
            let html = '';

            for (let row = 1; row <= selectedSection.rows; row++) {
                html += `<div class="seat-row"><span class="seat-row-label">Р${row}</span>`;
                
                for (let seat = 1; seat <= selectedSection.seatsPerRow; seat++) {
                    const isSold = Math.random() < 0.25;
                    const cls = isSold ? 'sold' : 'available';
                    html += `<div class="seat ${cls}" 
                                 onclick="selectSeat(${row}, ${seat}, this)" 
                                 data-row="${row}" 
                                 data-seat="${seat}">
                                ${seat}
                             </div>`;
                }
                
                html += `<span class="seat-row-label">Р${row}</span></div>`;
            }

            container.innerHTML = html;
        }

        function selectSeat(row, seat, element) {
            if (element.classList.contains('sold')) {
                showToast('Это место занято 😔');
                return;
            }

            document.querySelectorAll('.seat').forEach(s => s.classList.remove('selected'));
            element.classList.add('selected');

            selectedSeat = { row, seat };
            updateBottomBar();
            showToast(`Выбрано: Ряд ${row}, Место ${seat}`);
        }

        function showPreview() {
            if (!selectedSeat || !selectedSection) return;

            showScreen('preview');

            const distance = selectedSection.distance + (selectedSeat.row * 1.5);
            const angle = Math.abs(selectedSection.angle - 90);
            const quality = distance < 20 ? 'Отличное' : (distance < 30 ? 'Хорошее' : 'Среднее');
            const qualityClass = distance < 20 ? 'excellent' : (distance < 30 ? 'good' : 'average');

            document.getElementById('previewDistance').textContent = Math.round(distance) + 'м';
            document.getElementById('previewAngle').textContent = angle + '°';
            document.getElementById('previewQuality').textContent = quality;

            document.getElementById('seatInfoTitle').textContent = `${selectedSection.name}, Ряд ${selectedSeat.row}, Место ${selectedSeat.seat}`;
            document.getElementById('seatInfoSector').textContent = selectedSection.id;
            document.getElementById('seatInfoRow').textContent = selectedSeat.row;
            document.getElementById('seatInfoSeat').textContent = selectedSeat.seat;
            document.getElementById('seatInfoCategory').textContent = selectedSection.price > 10000 ? 'VIP' : (selectedSection.price > 6000 ? 'Премиум' : 'Стандарт');

            const badge = document.getElementById('seatQualityBadge');
            badge.textContent = quality + ' вид';
            badge.className = `seat-quality-badge quality-${qualityClass}`;

            // Update 3D preview perspective
            const viewport = document.getElementById('previewViewport');
            const field = viewport.querySelector('.preview-field');
            const perspective = Math.max(60, 90 - selectedSeat.row * 2);
            const translateZ = -100 - (selectedSeat.row * 5);
            
            field.style.transform = `translateX(-50%) rotateX(${perspective}deg) translateZ(${translateZ}px)`;

            updateBottomBar();
        }

        function showScreen(screen) {
            currentScreen = screen;
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(`screen-${screen}`).classList.add('active');

            const titles = {
                'stadium-select': '⚽ Выбор стадиона',
                'stadium-map': `🏟️ ${selectedStadium?.name || 'Стадион'}`,
                'seat-select': '💺 Выбор места',
                'preview': '👁️ Вид с места'
            };

            document.getElementById('headerTitle').textContent = titles[screen];
            document.getElementById('backBtn').style.display = screen === 'stadium-select' ? 'none' : 'flex';
        }

        function goBack() {
            const flow = ['stadium-select', 'stadium-map', 'seat-select', 'preview'];
            const idx = flow.indexOf(currentScreen);
            
            if (idx > 0) {
                const prevScreen = flow[idx - 1];
                
                if (currentScreen === 'preview') {
                    selectedSeat = null;
                } else if (currentScreen === 'seat-select') {
                    selectedSection = null;
                } else if (currentScreen === 'stadium-map') {
                    selectedStadium = null;
                }

                showScreen(prevScreen);
                
                if (prevScreen === 'stadium-select') {
                    renderStadiumCards();
                } else if (prevScreen === 'stadium-map') {
                    renderStadiumMap();
                } else if (prevScreen === 'seat-select') {
                    renderSeatGrid();
                }
                
                updateBottomBar();
            }
        }

        function nextScreen() {
            if (currentScreen === 'stadium-select' && selectedStadium) {
                showScreen('stadium-map');
                renderStadiumMap();
            } else if (currentScreen === 'stadium-map' && selectedSection) {
                selectSection();
            } else if (currentScreen === 'seat-select' && selectedSeat) {
                showPreview();
            } else if (currentScreen === 'preview') {
                showToast('Переход к оформлению билета 🎫');
            }
            updateBottomBar();
        }

        function updateBottomBar() {
            const bottomBar = document.getElementById('bottomBar');
            const btn = document.getElementById('bottomBtn');
            const price = document.getElementById('bottomPrice');
            const label = document.getElementById('bottomLabel');

            if (currentScreen === 'stadium-select') {
                bottomBar.style.display = 'none';
                return;
            }

            bottomBar.style.display = 'flex';

            switch (currentScreen) {
                case 'stadium-map':
                    if (selectedSection) {
                        btn.disabled = false;
                        btn.textContent = 'Выбрать места →';
                        price.textContent = selectedSection.price.toLocaleString() + ' ₽';
                        label.textContent = selectedSection.name;
                    } else {
                        btn.disabled = true;
                        btn.textContent = 'Выберите сектор';
                        price.textContent = 'от 2 500 ₽';
                        label.textContent = selectedStadium?.name || '';
                    }
                    break;

                case 'seat-select':
                    if (selectedSeat) {
                        btn.disabled = false;
                        btn.textContent = 'Посмотреть вид →';
                        price.textContent = selectedSection.price.toLocaleString() + ' ₽';
                        label.textContent = `Ряд ${selectedSeat.row}, Место ${selectedSeat.seat}`;
                    } else {
                        btn.disabled = true;
                        btn.textContent = 'Выберите место';
                        price.textContent = selectedSection.price.toLocaleString() + ' ₽';
                        label.textContent = selectedSection.name;
                    }
                    break;

                case 'preview':
                    btn.disabled = false;
                    btn.textContent = 'Купить билет →';
                    price.textContent = selectedSection.price.toLocaleString() + ' ₽';
                    label.textContent = 'Итого';
                    break;
            }
        }

        function zoomIn() {
            mapScale = Math.min(mapScale * 1.2, 3);
            updateMapTransform();
        }

        function zoomOut() {
            mapScale = Math.max(mapScale / 1.2, 1);
            updateMapTransform();
        }

        function resetZoom() {
            mapScale = 1;
            mapTranslateX = 0;
            mapTranslateY = 0;
            updateMapTransform();
        }

        function updateMapTransform() {
            const svg = document.getElementById('stadiumSvg');
            svg.style.transform = `scale(${mapScale}) translate(${mapTranslateX}px, ${mapTranslateY}px)`;
        }

        function rotateView() {
            const viewport = document.getElementById('previewViewport');
            viewport.style.transform = 'scale(1.05) rotate(5deg)';
            setTimeout(() => viewport.style.transform = '', 500);
            showToast('Панорамный вид 🔄');
        }

        function toggle360() {
            showToast('360° режим скоро будет доступен! 🎥');
        }

        function shareView() {
            if (tg?.switchInlineQuery) {
                tg.switchInlineQuery(`Смотри какой вид с моего места на ${selectedStadium?.name}!`);
            }
            showToast('Ссылка скопирована! 📤');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // Touch/pan support for map
        let isDragging = false;
        let startX, startY;

        const mapContainer = document.getElementById('mapContainer');
        
        mapContainer.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - mapTranslateX;
            startY = e.clientY - mapTranslateY;
        });

        mapContainer.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            mapTranslateX = (e.clientX - startX) / mapScale;
            mapTranslateY = (e.clientY - startY) / mapScale;
            updateMapTransform();
        });

        mapContainer.addEventListener('mouseup', () => isDragging = false);
        mapContainer.addEventListener('mouseleave', () => isDragging = false);

        // Initialize
        renderStadiumCards();
        updateBottomBar();
    </script>
</body>
</html>
