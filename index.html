<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tickets · Seat View</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0a0c;--card:#141417;--y:#ffd24c;--mut:#8b8b93;--line:rgba(255,255,255,.08)}
html,body{height:100%}
body{background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',Roboto,sans-serif;overflow:hidden;user-select:none}
#app{max-width:520px;margin:0 auto;height:100vh;position:relative;display:flex;flex-direction:column}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:12px;padding:14px 16px 10px;z-index:20}
.cbtn{width:42px;height:42px;border-radius:50%;background:#1d1d22;border:none;color:#fff;font-size:17px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:.2s}
.cbtn:active{transform:scale(.88)}
.htxt{flex:1;text-align:center}
.htxt h1{font-size:18px;font-weight:700;letter-spacing:.2px}
.htxt p{font-size:12.5px;color:var(--mut);margin-top:2px}
.chips{display:flex;gap:8px;justify-content:center;padding:6px 16px 12px;z-index:20}
.chip{display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:22px;border:1px solid var(--line);
  background:rgba(255,255,255,.03);font-size:13px;cursor:pointer;transition:.25s}
.chip .d{width:10px;height:10px;border-radius:3px}
.chip b{font-weight:700}
.chip.dim{opacity:.35}
.chip:active{transform:scale(.94)}

/* ---------- screens ---------- */
.stage{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;transition:opacity .5s ease,transform .6s cubic-bezier(.55,.1,.3,1)}
.view.off{opacity:0;pointer-events:none}

/* map */
#mapwrap{display:flex;align-items:center;justify-content:center;height:100%}
#mapzoom{transition:transform .75s cubic-bezier(.6,.05,.25,1);will-change:transform}
svg#map{width:100%;height:auto;display:block}
.sec{cursor:pointer;transition:opacity .3s}
.sec path{transition:fill .2s}
.sec.dim{opacity:.25}
.sec.sel path{fill:var(--y)!important}
.seclbl{font-size:8.5px;font-weight:600;fill:#c9c9d1;text-anchor:middle;pointer-events:none}
.compass{font-size:9px;letter-spacing:3px;fill:#6d6d75;text-anchor:middle;font-weight:700}

/* seats */
#seatwrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.pitchmark{color:#8b8b93;font-size:10px;letter-spacing:3px;text-align:center;font-weight:700}
.pitchmark i{display:block;font-style:normal;font-size:13px;margin-bottom:2px}
#seatcv{touch-action:manipulation}
.sectinfo{text-align:center;margin-top:8px}
.sectinfo h3{font-size:17px;font-weight:700}
.sectinfo p{font-size:13px;color:var(--mut);margin-top:3px}
.leg{display:flex;gap:22px;justify-content:center;margin-top:10px;font-size:12.5px;color:#a9a9b1}
.leg span{display:flex;align-items:center;gap:7px}
.leg i{width:11px;height:11px;border-radius:3px;display:block}
#ripple{position:fixed;width:56px;height:56px;border:2px solid rgba(255,255,255,.55);border-radius:50%;
  pointer-events:none;transform:translate(-50%,-50%) scale(.4);opacity:0;z-index:60}
#ripple.go{animation:rip .55s ease-out}
@keyframes rip{0%{opacity:1;transform:translate(-50%,-50%) scale(.4)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.25)}}

/* 3d */
#glwrap{position:absolute;inset:0;background:#0b0e18}
#gl{width:100%;height:100%;display:block;touch-action:none}
#pill{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:9px;
  background:rgba(20,20,24,.85);backdrop-filter:blur(10px);padding:11px 18px;border-radius:24px;font-size:14px;
  font-weight:600;z-index:15;white-space:nowrap;opacity:0;transition:opacity .4s}
#pill.on{opacity:1}
#pill .dot{width:8px;height:8px;border-radius:50%;background:var(--y)}
#back3d{position:absolute;top:14px;left:14px;z-index:16}
#hint{position:absolute;bottom:38%;left:50%;transform:translateX(-50%);background:rgba(15,15,18,.8);
  backdrop-filter:blur(8px);padding:9px 16px;border-radius:20px;font-size:13px;color:#d5d5dc;display:flex;gap:8px;
  align-items:center;z-index:15;transition:opacity .5s;pointer-events:none}

/* ---------- bottom sheet ---------- */
#sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:26px 26px 0 0;
  padding:10px 20px calc(18px + env(safe-area-inset-bottom));z-index:30;
  transform:translateY(0);transition:transform .55s cubic-bezier(.3,1.3,.4,1);box-shadow:0 -12px 40px rgba(0,0,0,.5)}
#sheet.up{transform:translateY(-6px)}
.handle{width:40px;height:4px;border-radius:2px;background:#2e2e35;margin:2px auto 14px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:14px}
.shl{font-size:13px;color:var(--mut)}
.shv{font-size:21px;font-weight:800;margin-top:3px;letter-spacing:.2px}
#cont{padding:16px 34px;border-radius:32px;border:none;font-size:15px;font-weight:700;cursor:pointer;
  background:#232329;color:#5c5c66;transition:.3s;flex-shrink:0}
#cont.on{background:var(--y);color:#111}
#cont:active{transform:scale(.95)}

/* 3d sheet content */
#sh3d{display:none}
#sh3d.on{display:block}
.vcat{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:2.5px;color:var(--y);font-weight:700}
.vsec{font-size:30px;font-weight:800;margin-top:6px;letter-spacing:.3px}
.vsub{font-size:14px;color:var(--mut);margin-top:4px}
#mini{position:absolute;right:20px;top:34px}
.stats{display:flex;margin-top:18px;border-top:1px solid var(--line)}
.stats div{flex:1;padding:14px 4px 14px 0;border-bottom:1px solid var(--line)}
.stats div+div{padding-left:16px;border-left:1px solid var(--line)}
.stats b{font-size:21px;font-weight:800;display:block}
.stats span{font-size:11.5px;color:var(--mut);display:block;margin-top:3px}
.btns{display:flex;gap:10px;margin-top:18px}
#changeBtn{flex:1;padding:17px;border-radius:32px;border:1px solid var(--line);background:none;color:#fff;
  font-size:15px;font-weight:700;cursor:pointer}
#buyBtn{flex:1.4;padding:17px;border-radius:32px;border:none;background:#f2f2f5;color:#111;font-size:15px;
  font-weight:800;cursor:pointer;transition:.3s}
#buyBtn.ok{background:var(--y)}
#changeBtn:active,#buyBtn:active{transform:scale(.96)}
.fade{position:absolute;inset:0;background:#0a0a0c;z-index:40;pointer-events:none;opacity:0;transition:opacity .45s}
</style>
</head>
<body>
<div id="app">
  <header id="hdr">
    <button class="cbtn" onclick="back()">‹</button>
    <div class="htxt"><h1 id="mTitle">Спартак — ЦСКА</h1><p id="mSub">РПЛ · сб, 25 ноя · 19:30</p></div>
    <button class="cbtn">ⓘ</button>
  </header>
  <div class="chips" id="chips"></div>

  <div class="stage">
    <!-- MAP -->
    <div class="view" id="vMap"><div id="mapwrap"><div id="mapzoom"><svg id="map" viewBox="0 0 640 700"></svg></div></div></div>
    <!-- SEATS -->
    <div class="view off" id="vSeat"><div id="seatwrap">
      <div class="pitchmark"><i>⌃</i>PITCH</div>
      <canvas id="seatcv"></canvas>
      <div class="sectinfo"><h3 id="siT">Section</h3><p id="siS"></p></div>
      <div class="leg"><span><i style="background:#9a9aa2"></i>Available</span><span><i style="background:#26262c"></i>Taken</span></div>
    </div></div>
    <!-- 3D -->
    <div class="view off" id="v3d"><div id="glwrap"><canvas id="gl"></canvas></div>
      <button class="cbtn" id="back3d" onclick="back()">‹</button>
      <div id="pill"><span class="dot"></span><span id="pillT"></span></div>
      <div id="hint">↔ Drag to look around</div>
    </div>
    <div class="fade" id="fade"></div>
  </div>

  <div id="sheet"><div class="handle"></div>
    <div id="shSimple"><div class="srow">
      <div><div class="shl" id="shL">Choose a section</div><div class="shv" id="shV">from 2 500 ₽</div></div>
      <button id="cont" onclick="cont()">Continue</button>
    </div></div>
    <div id="sh3d">
      <div class="vcat" id="vCat">UPPER CORNER</div>
      <div class="vsec" id="vSec">Section 217</div>
      <div class="vsub" id="vSub">Row 12 · Seat 17 · Upper tier</div>
      <canvas id="mini" width="110" height="140"></canvas>
      <div class="stats">
        <div><b id="st1">—</b><span>to the centre spot</span></div>
        <div><b id="st2">—</b><span>to the nearest goal</span></div>
        <div><b id="st3">—</b><span>above the pitch</span></div>
      </div>
      <div class="btns"><button id="changeBtn" onclick="back()">Change seat</button>
      <button id="buyBtn" onclick="buy(this)">Buy ticket · <span id="buyP"></span></button></div>
    </div>
  </div>
  <div id="ripple"></div>
</div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
const tg=window.Telegram?.WebApp; tg?.ready(); tg?.expand();
const hap=t=>tg?.HapticFeedback?.impactOccurred(t);
const $=id=>document.getElementById(id);
const fmt=n=>n.toLocaleString('ru-RU')+' ₽';

/* ============ ДАННЫЕ: категории и геометрия чаши ============ */
const CAT={1:{p:7500,c:'#8f8f98'},2:{p:4500,c:'#6e6e78'},3:{p:2500,c:'#4b4b55'}};
// rounded-rect bowl: half A(x), B(z), radius R — база чаши чуть больше поля 105×68
const A0=57,B0=38,R0=16;
const SEGS=(()=>{const s=[];const L=2*(A0-R0),Ar=Math.PI*R0/2,S=2*(B0-R0);
  const push=(len,f)=>s.push({len,f});
  push(L,t=>[ -(A0-R0)+t*L, -B0, 0,-1 ]);              // north straight
  push(Ar,t=>{const a=-Math.PI/2+t*Math.PI/2;return[ (A0-R0)+R0*Math.cos(a), (-(B0-R0))+R0*Math.sin(a), Math.cos(a),Math.sin(a) ];});
  push(S,t=>[ A0, -(B0-R0)+t*S, 1,0 ]);                  // east (behind goal)
  push(Ar,t=>{const a=t*Math.PI/2;return[ (A0-R0)+R0*Math.cos(a), (B0-R0)+R0*Math.sin(a), Math.cos(a),Math.sin(a) ];});
  push(L,t=>[ (A0-R0)-t*L, B0, 0,1 ]);                   // south straight
  push(Ar,t=>{const a=Math.PI/2+t*Math.PI/2;return[ -(A0-R0)+R0*Math.cos(a), (B0-R0)+R0*Math.sin(a), Math.cos(a),Math.sin(a) ];});
  push(S,t=>[ -A0, (B0-R0)-t*S, -1,0 ]);                 // west (behind goal)
  push(Ar,t=>{const a=Math.PI+t*Math.PI/2;return[ -(A0-R0)+R0*Math.cos(a), -(B0-R0)+R0*Math.sin(a), Math.cos(a),Math.sin(a) ];});
  return s;})();
const PER=SEGS.reduce((a,s)=>a+s.len,0);
function rr(d,o){d=((d%PER)+PER)%PER;for(const s of SEGS){if(d<=s.len){const[x,z,nx,nz]=s.f(d);return[x+nx*o,z+nz*o,nx,nz];}d-=s.len;}
  const[x,z,nx,nz]=SEGS[0].f(0);return[x+nx*o,z+nz*o,nx,nz];}

/* секторы: 2 яруса × 28 */
const NSEC=28, SECTIONS=[];
for(let tier=0;tier<2;tier++)for(let i=0;i<NSEC;i++){
  const d0=PER*i/NSEC,d1=PER*(i+1)/NSEC, mid=(d0+d1)/2;
  const[x,z,nx,nz]=rr(mid,10);
  const zone=Math.abs(nx)>0.9?'goal':Math.abs(nz)>0.9?'side':'corner';
  const dir=zone==='side'?(z<0?'North stand':'South stand'):zone==='goal'?(x>0?'East end':'West end'):
    (x>0?(z<0?'North-east':'South-east'):(z<0?'North-west':'South-west'))+' corner';
  const cat=tier===0?(zone==='side'?1:2):(zone==='side'?2:3);
  SECTIONS.push({id:(tier?201:101)+i,tier,zone,dir,cat,d0,d1,
    label:zone==='side'?'HALFWAY LINE':zone==='goal'?'BEHIND THE GOAL':'UPPER CORNER'.replace('UPPER',tier?'UPPER':'LOWER')==='x'?'':(zone==='corner'?(tier?'UPPER':'LOWER')+' CORNER':zone==='side'?'HALFWAY LINE':'BEHIND THE GOAL'),
    blocked:(i%9===4)});
}
const TIERS=[{o0:5,dep:.85,y0:1.4,rise:.42,rows:18},{o0:22,dep:.95,y0:13,rise:.55,rows:16}];

/* ============ СОСТОЯНИЕ ============ */
let S={screen:'map',sec:null,seat:null,yaw:0,pitch:0,tyaw:0,tpitch:0};

/* ============ SVG ЧАША ============ */
function buildMap(){
  let h=`<text class="compass" x="320" y="26">NORTH</text><text class="compass" x="320" y="690">SOUTH</text>
  <text class="compass" x="14" y="355" transform="rotate(-90 14 355)">WEST</text>
  <text class="compass" x="626" y="355" transform="rotate(90 626 355)">EAST</text>`;
  const P=(d,o)=>{const[x,z]=rr(d,o);return[320+x*4.4,350+z*4.4];};
  SECTIONS.forEach(s=>{
    const o0=s.tier?22:5, o1=o0+(s.tier?15:15);
    let pts=[];const N=5;
    for(let i=0;i<=N;i++)pts.push(P(s.d0+(s.d1-s.d0)*i/N,o0));
    for(let i=N;i>=0;i--)pts.push(P(s.d0+(s.d1-s.d0)*i/N,o1));
    const d='M'+pts.map(p=>p.map(v=>v.toFixed(1)).join(',')).join('L')+'Z';
    const[mx,mz]=P((s.d0+s.d1)/2,(o0+o1)/2);
    h+=`<g class="sec ${s.blocked?'blocked':''}" data-id="${s.id}">
      <path d="${d}" fill="${s.blocked?'#101014':CAT[s.cat].c}" stroke="#0a0a0c" stroke-width="2.5"/>
      ${!s.blocked?`<text class="seclbl" x="${mx}" y="${mz+3}">${s.id}</text>`:''}</g>`;
  });
  // поле
  h+=`<g><rect x="${320-52.5*4.4}" y="${350-34*4.4}" width="${105*4.4}" height="${68*4.4}" fill="#1d4d2c"/>
  <rect x="${320-48*4.4}" y="${350-30*4.4}" width="${96*4.4}" height="${60*4.4}" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.4"/>
  <line x1="320" y1="${350-30*4.4}" x2="320" y2="${350+30*4.4}" stroke="rgba(255,255,255,.45)" stroke-width="1.4"/>
  <circle cx="320" cy="350" r="${9.15*4.4}" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.4"/></g>`;
  $('map').innerHTML=h;
  $('map').querySelectorAll('.sec').forEach(g=>g.onclick=e=>{
    const s=SECTIONS.find(x=>x.id==g.dataset.id);
    if(s.blocked){hap('heavy');return;}
    pickSection(s,g);
  });
}
function pickSection(s,g){
  S.sec=s; S.seat=null; hap('medium');
  $('map').querySelectorAll('.sec').forEach(x=>x.classList.remove('sel'));
  g.classList.add('sel');
  // ZOOM-анимация чаши к сектору (как в видео)
  const[mid]=[(s.d0+s.d1)/2]; const[x,z,nx,nz]=rr(mid,14);
  const sx=320+x*4.4, sy=350+z*4.4, ang=Math.atan2(nz,nx)*180/Math.PI;
  $('mapzoom').style.transformOrigin=`${sx/6.4}% ${sy/7}%`;
  $('mapzoom').style.transform=`scale(3.1) rotate(${(-ang*0.28).toFixed(1)}deg)`;
  setTimeout(()=>{showSeat();},430);
}
function zoomReset(){$('mapzoom').style.transform='scale(1)';}

/* ============ ВЕЕР МЕСТ (Canvas 2D) ============ */
let seatHits=[];
function showSeat(){
  S.screen='seat';
  $('vMap').classList.add('off'); $('vSeat').classList.remove('off');
  const s=S.sec;
  $('siT').textContent='Section '+s.id;
  $('siS').textContent=(s.tier?'Upper tier · ':'Lower tier · ')+s.dir;
  $('shL').textContent=`Section ${s.id} · ${s.tier?'Upper':'Lower'} tier`;
  $('shV').textContent='Choose a seat';
  $('cont').classList.remove('on'); $('cont').disabled=true;
  drawSeats();
}
function drawSeats(){
  const cv=$('seatcv'), W=Math.min(innerWidth-40,420), H=Math.min(innerHeight*.52,460);
  const dpr=Math.min(devicePixelRatio,2); cv.width=W*dpr; cv.height=H*dpr;
  cv.style.width=W+'px'; cv.style.height=H+'px';
  const c=cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,W,H);
  const s=S.sec, rows=s.tier?20:22, top=8, rh=(H-20)/rows;
  seatHits=[];
  let seed=s.id*7919; const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  // жёлтая рамка веера
  const w0=W*.36, grow=(W*.46-w0)/rows;
  c.strokeStyle='rgba(255,210,76,.8)'; c.lineWidth=1.4;
  c.beginPath(); c.moveTo(W/2-w0,top); c.lineTo(W/2+w0+grow*rows*.5,top);
  c.lineTo(W/2+w0+grow*rows,H-8); c.lineTo(W/2-w0-grow*0,H-8); c.closePath(); c.stroke();
  for(let r=0;r<rows;r++){
    const y=top+r*rh+2, hw=w0+grow*r, sw=11, n=Math.floor((hw*2)/sw);
    const curve=10*(1-Math.pow(Math.abs(0)/hw,2)); // дуга ряда
    for(let k=0;k<n;k++){
      const x=W/2-hw+k*sw+2, t=(x-W/2)/hw, yy=y+ (t*t)*6; // лёгкая дуга
      const taken=rnd()<.3, sel=S.seat&&S.seat.r===r+1&&S.seat.n===k+1;
      c.fillStyle=sel?'#ffd24c':taken?'#26262c':'#9a9aa2';
      c.beginPath(); c.roundRect(x,yy,sw-3,rh-3,2.5); c.fill();
      seatHits.push({x,y:yy,w:sw-3,h:rh-3,r:r+1,n:k+1,taken});
    }
    c.fillStyle='#77777f'; c.font='8px sans-serif'; c.fillText(r+1,W/2+hw+grow*r+8,y+rh/2);
  }
  cv.onclick=e=>{
    const rc=cv.getBoundingClientRect(), x=e.clientX-rc.left, y=e.clientY-rc.top;
    const hit=seatHits.find(h=>x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h);
    if(!hit)return;
    if(hit.taken){hap('heavy');return;}
    S.seat={r:hit.r,n:hit.n}; hap('medium');
    const rp=$('ripple'); rp.style.left=(rc.left+hit.x+hit.w/2)+'px'; rp.style.top=(rc.top+hit.y+hit.h/2)+'px';
    rp.classList.remove('go'); void rp.offsetWidth; rp.classList.add('go');
    drawSeats();
    $('shL').textContent=`Sec ${S.sec.id} · Row ${hit.r} · Seat ${hit.n}`;
    $('shV').textContent=fmt(CAT[S.sec.cat].p);
    $('cont').classList.add('on'); $('cont').disabled=false;
  };
}

/* ============ THREE.js СЦЕНА ============ */
let renderer,scene,camera,seatPos=new THREE.Vector3(),focus=new THREE.Vector3(0,1.2,0),q0=new THREE.Quaternion(),ready3d=false;
function init3D(){
  if(ready3d)return; ready3d=true;
  const cv=$('gl');
  renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  scene=new THREE.Scene();
  scene.fog=new THREE.Fog(0x0b0e18,140,430);
  // небо-закат
  const sk=document.createElement('canvas'); sk.width=2; sk.height=256;
  const sc=sk.getContext('2d'), g=sc.createLinearGradient(0,0,0,256);
  g.addColorStop(0,'#2c3a63'); g.addColorStop(.55,'#5a5a86'); g.addColorStop(.8,'#c98d76'); g.addColorStop(1,'#e8b28c');
  sc.fillStyle=g; sc.fillRect(0,0,2,256);
  const skyTex=new THREE.CanvasTexture(sk); scene.background=skyTex;
  camera=new THREE.PerspectiveCamera(62,1,.1,900);
  scene.add(new THREE.HemisphereLight(0xbcd0ff,0x0a0d16,1.15));
  const dl=new THREE.DirectionalLight(0xffffff,1.1); dl.position.set(60,90,40); scene.add(dl);

  /* газон с полосами и разметкой */
  const pc=document.createElement('canvas'); pc.width=1024; pc.height=664;
  const p=pc.getContext('2d');
  for(let i=0;i<12;i++){p.fillStyle=i%2?'#2f9e4f':'#28924a';p.fillRect(i*1024/12,0,1024/12,664);}
  p.strokeStyle='rgba(255,255,255,.9)'; p.lineWidth=3; const X=x=>512+x*(1024/110), Z=z=>332+z*(664/70);
  p.strokeRect(X(-52.5),Z(-34),105*9.31,68*9.49);
  p.beginPath(); p.moveTo(X(0),Z(-34)); p.lineTo(X(0),Z(34)); p.stroke();
  p.beginPath(); p.ellipse(X(0),Z(0),9.15*9.31,9.15*9.49,0,0,7); p.stroke();
  [[-1],[1]].forEach(([s])=>{p.strokeRect(X(s*52.5-s*16.5),Z(-20.16),16.5*9.31,40.3*9.49);
    p.strokeRect(X(s*52.5-s*5.5),Z(-9.16),5.5*9.31,18.32*9.49);});
  const pitch=new THREE.Mesh(new THREE.PlaneGeometry(105,68),new THREE.MeshLambertMaterial({map:new THREE.CanvasTexture(pc)}));
  pitch.rotation.x=-Math.PI/2; scene.add(pitch);

  /* кресла: InstancedMesh (пан + спинка) = 2 draw call на ~26 000 мест */
  const mats=[];
  const dummy=new THREE.Object3D();
  SECTIONS.forEach(s=>{ if(s.blocked)return; const T=TIERS[s.tier];
    for(let r=0;r<T.rows;r++){ const o=T.o0+r*T.dep, y=T.y0+r*T.rise;
      const len=(s.d1-s.d0)*(1+o*0.004), n=Math.floor(len/0.6);
      for(let k=0;k<n;k++){ const d=s.d0+(k+.5)*len/n; const[x,z,nx,nz]=rr(d,o);
        dummy.position.set(x,y,z);
        dummy.lookAt(x-nx*30,0,z-nz*30);
        dummy.updateMatrix();
        mats.push({m:dummy.matrix.clone(),tier:s.tier});
      }}});
  const count=mats.length;
  const pan=new THREE.InstancedMesh(new THREE.BoxGeometry(.46,.34,.42).translate(0,.17,0),
    new THREE.MeshLambertMaterial(),count);
  const back=new THREE.InstancedMesh(new THREE.BoxGeometry(.46,.5,.09).translate(0,.5,-.17),
    new THREE.MeshLambertMaterial(),count);
  const col=new THREE.Color();
  mats.forEach(({m,tier},i)=>{ pan.setMatrixAt(i,m); back.setMatrixAt(i,m);
    col.setHSL(.62,.75,.34+Math.random()*.08+(tier?.03:0));
    pan.setColorAt(i,col); back.setColorAt(i,col); });
  scene.add(pan,back);

  /* лента яруса (золотая) + световая линия крыши */
  const loop=(o,y,r,mat)=>{const pts=[];for(let i=0;i<160;i++){const[x,z]=rr(PER*i/160,o);pts.push(new THREE.Vector3(x,y,z));}
    pts.push(pts[0].clone());
    scene.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),160,r,6),mat));};
  loop(20.5,12.4,.9,new THREE.MeshLambertMaterial({color:0xc9a05a}));
  loop(38,44,.5,new THREE.MeshBasicMaterial({color:0xffffff}));
  /* крыша-кольцо */
  const shape=new THREE.Shape(); const hole=new THREE.Path();
  const rp2=(o)=>{const pts=[];for(let i=0;i<=80;i++){const[x,z]=rr(PER*i/80,o);pts.push([x,z]);}return pts;};
  rp2(46).forEach(([x,z],i)=>i?shape.lineTo(x,z):shape.moveTo(x,z)); shape.closePath();
  rp2(30).reverse().forEach(([x,z],i)=>i?hole.lineTo(x,z):hole.moveTo(x,z)); hole.closePath();
  shape.holes.push(hole);
  const roof=new THREE.Mesh(new THREE.ShapeGeometry(shape),new THREE.MeshLambertMaterial({color:0x14161d,side:THREE.DoubleSide}));
  roof.rotation.x=Math.PI/2; roof.position.y=45; scene.add(roof);
  /* борта вокруг поля */
  loop(2.2,0.6,.35,new THREE.MeshLambertMaterial({color:0x101a3a}));
  /* ворота с сеткой */
  [[-1],[1]].forEach(([s])=>{ const gx=s*52.5;
    const post=new THREE.MeshLambertMaterial({color:0xffffff});
    [-3.66,3.66].forEach(z=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,2.44),post);m.position.set(gx,1.22,z);scene.add(m);});
    const bar=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,7.32),post); bar.rotation.x=Math.PI/2; bar.position.set(gx,2.44,0); scene.add(bar);
    const nl=new THREE.LineSegments(new THREE.BufferGeometry(),new THREE.LineBasicMaterial({color:0xdddddd,transparent:true,opacity:.35}));
    const v=[]; for(let i=0;i<=8;i++){const z=-3.66+i*.915; v.push(gx,2.44,z, gx+s*2,1.6,z, gx+s*2,0,z, gx+s*2,2.0,z);}
    for(let j=0;j<=4;j++){const y=j*.5; v.push(gx+s*2,y,-3.66, gx+s*2,y,3.66);}
    nl.geometry.setAttribute('position',new THREE.Float32BufferAttribute(v,3)); scene.add(nl);});
  /* табло */
  const bc=document.createElement('canvas'); bc.width=512; bc.height=256; const b=bc.getContext('2d');
  b.fillStyle='#000'; b.fillRect(0,0,512,256); b.fillStyle='#fff'; b.textAlign='center';
  b.font='20px sans-serif'; b.fillText('THE FINAL · KICK-OFF',256,60);
  b.font='bold 64px sans-serif'; b.fillText('19:30',256,140);
  b.font='22px sans-serif'; b.fillText('SPARTAK  —  CSKA',256,200);
  const board=new THREE.Mesh(new THREE.PlaneGeometry(20,10),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(bc)}));
  board.position.set(0,36,-(B0+34)); scene.add(board);

  /* drag-обзор с инерцией */
  let drag=false,lx=0,ly=0;
  cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;$('hint').style.opacity=0;});
  addEventListener('pointermove',e=>{ if(!drag)return;
    S.tyaw=THREE.MathUtils.clamp(S.tyaw-(e.clientX-lx)*.0032,-1.1,1.1);
    S.tpitch=THREE.MathUtils.clamp(S.tpitch-(e.clientY-ly)*.0026,-.55,.35);
    lx=e.clientX; ly=e.clientY;});
  addEventListener('pointerup',()=>drag=false);
  addEventListener('resize',resize3d); resize3d();
  (function anim(){ requestAnimationFrame(anim);
    S.yaw+=(S.tyaw-S.yaw)*.09; S.pitch+=(S.tpitch-S.pitch)*.09;   // damping
    if(S.screen==='3d'){ camera.position.copy(seatPos);
      camera.quaternion.copy(q0);
      camera.rotateX(S.pitch); camera.rotateY(S.yaw);
      renderer.render(scene,camera);} })();
}
function resize3d(){ const w=$('glwrap').clientWidth,h=$('glwrap').clientHeight;
  renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }

/* ============ ВЛЁТ КАМЕРЫ В МЕСТО ============ */
function seatWorld(){
  const s=S.sec,T=TIERS[s.tier],r=S.seat.r;
  const o=T.o0+(r-1)*T.dep, y=T.y0+(r-1)*T.rise+1.15;
  const len=(s.d1-s.d0)*(1+o*.004), n=Math.floor(len/0.6);
  const d=s.d0+(Math.min(S.seat.n,n)-.5)*len/n;
  const[x,z]=rr(d,o); return new THREE.Vector3(x,y,z);
}
function enter3D(){
  S.screen='3d'; init3D();
  seatPos=seatWorld(); S.yaw=S.tyaw=0; S.pitch=S.tpitch=0;
  const cam0=seatPos.clone().multiplyScalar(1.5); cam0.y+=16;
  camera.position.copy(cam0); camera.lookAt(focus); q0=camera.quaternion.clone();
  $('vSeat').classList.add('off'); $('vMap').classList.add('off'); $('v3d').classList.remove('off');
  $('hdr').style.opacity=0; $('chips').style.opacity=0;
  $('pillT').textContent=`View from ${S.sec.id} · Row ${S.seat.r} · Seat ${S.seat.n}`;
  $('pill').classList.add('on'); $('hint').style.opacity=1;
  // sheet → 3D-вариант
  $('shSimple').style.display='none'; $('sh3d').classList.add('on'); $('sheet').classList.add('up');
  $('vCat').textContent=S.sec.label; $('vSec').textContent='Section '+S.sec.id;
  $('vSub').textContent=`Row ${S.seat.r} · Seat ${S.seat.n} · ${S.sec.tier?'Upper':'Lower'} tier`;
  $('buyP').textContent=fmt(CAT[S.sec.cat].p);
  $('st1').textContent=Math.round(Math.hypot(seatPos.x,seatPos.z))+' m';
  $('st2').textContent=Math.round(Math.min(Math.hypot(seatPos.x-52.5,seatPos.z),Math.hypot(seatPos.x+52.5,seatPos.z)))+' m';
  $('st3').textContent=Math.round(seatPos.y-1.15)+' m';
  drawMini();
  // tween полёта камеры (кроссфейд с веером)
  const t0=performance.now(),D=1300;
  (function fly(t){ const k=Math.min(1,(t-t0)/D), e=1-Math.pow(1-k,3);
    camera.position.lerpVectors(cam0,seatPos,e);
    camera.lookAt(focus); q0=camera.quaternion.clone();
    if(k<1)requestAnimationFrame(fly); })(t0);
  hap('medium');
}
function drawMini(){
  const c=$('mini').getContext('2d'); c.clearRect(0,0,110,140);
  c.strokeStyle='#3a3a42'; c.lineWidth=7;
  const path=o=>{c.beginPath();for(let i=0;i<=60;i++){const[x,z]=rr(PER*i/60,o);const px=55+x*.72,py=70+z*.85;i?c.lineTo(px,py):c.moveTo(px,py);}c.closePath();c.stroke();};
  path(8); path(26);
  c.fillStyle='#1d4d2c'; c.fillRect(55-52.5*.62,70-34*.72,105*.62,68*.72);
  const mid=(S.sec.d0+S.sec.d1)/2,[x,z]=rr(mid,S.sec.tier?26:8);
  c.fillStyle='#ffd24c'; c.save(); c.translate(55+x*.72,70+z*.85); c.rotate(Math.atan2(z,x)); c.fillRect(-3,-5,6,10); c.restore();
}

/* ============ НАВИГАЦИЯ ============ */
window.cont=()=>{ if(S.screen==='seat'&&S.seat)enter3D(); };
window.back=()=>{
  if(S.screen==='3d'){ S.screen='seat'; $('v3d').classList.add('off'); $('vSeat').classList.remove('off');
    $('sh3d').classList.remove('on'); $('shSimple').style.display=''; $('sheet').classList.remove('up');
    $('pill').classList.remove('off'); $('pill').classList.remove('on');
    $('hdr').style.opacity=1; $('chips').style.opacity=1; drawSeats(); }
  else if(S.screen==='seat'){ S.screen='map'; zoomReset(); $('vSeat').classList.add('off'); $('vMap').classList.remove('off');
    $('shL').textContent='Choose a section'; $('shV').textContent='from '+fmt(CAT[3].p);
    $('cont').classList.remove('on'); $('cont').disabled=true;
    $('map').querySelectorAll('.sec').forEach(x=>x.classList.remove('sel')); }
};
window.buy=b=>{ b.classList.add('ok'); b.innerHTML='✓ Added to basket'; hap('heavy'); tg?.HapticFeedback?.notificationOccurred('success'); };

/* chips */
$('chips').innerHTML=[1,2,3].map(i=>`<div class="chip" data-c="${i}"><span class="d" style="background:${CAT[i].c}"></span>Cat ${i}&nbsp;<b>${fmt(CAT[i].p)}</b></div>`).join('');
$('chips').querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{
  const on=ch.classList.contains('dim');
  $('chips').querySelectorAll('.chip').forEach(x=>x.classList.remove('dim'));
  if(!on){ ch.classList.add('dim'); }
  const dimC=[...$('chips').querySelectorAll('.chip.dim')].map(x=>+x.dataset.c);
  $('map').querySelectorAll('.sec').forEach(g=>{ const s=SECTIONS.find(x=>x.id==g.dataset.id);
    g.classList.toggle('dim',dimC.includes(s.cat)); });
});

buildMap();
$('shV').textContent='from '+fmt(CAT[3].p);
</script>
